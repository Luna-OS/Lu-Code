# Standardwerte – jede Einstellung lässt sich mit LUCODE_<NAME> überschreiben,
# z. B. LUCODE_PORT=9000 oder LUCODE_PREVIEW_PORT=0 (Vorschau aus) (siehe src/config.rs).
[default]
address = "0.0.0.0"
port = 8510
ident = "luCode"
data_dir = "./data"
preview_port = 8511
limits = { file = "200MiB", data-form = "210MiB", form = "64KiB", json = "8MiB", string = "8MiB" }
# Sauber beenden bei Ctrl-C und SIGTERM (docker stop): laufende Anfragen abschliessen,
# dann die Datenbank schliessen.
shutdown = { ctrlc = true, signals = ["term", "hup"], grace = 5, mercy = 5 }

[debug]
log_level = "normal"

[release]
log_level = "critical"
